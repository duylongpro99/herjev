[project]
name = "herjev"
version = "0.1.0"
description = "Log-watch agent: poll/listen to remote telemetry logs, decide with Jev, reason with an LLM, alert through channels."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.25",
  "psycopg[binary,pool]>=3.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "respx>=0.21"]
mcp = ["mcp>=2.3"]

# A plain `uv run` / `uv sync` in this checkout installs these, so the MCP
# endpoint works without --extra flags. Installing the package (pip install
# herjev) still keeps it optional.
[dependency-groups]
local = ["herjev[mcp]"]

[tool.uv]
default-groups = ["local"]

[project.scripts]
herjev = "herjev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herjev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
